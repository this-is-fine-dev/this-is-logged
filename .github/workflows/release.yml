name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version from tag
        run: |
          version=${GITHUB_REF_NAME#v}
          [[ "$version" =~ ^[0-9]{1,3}\.[0-9]{1,2}\.[0-9]{1,2}$ ]]
          /usr/bin/plutil -replace CFBundleShortVersionString -string "$version" macos/Info.plist
          /usr/bin/plutil -replace CFBundleVersion -string "1$version" macos/Info.plist

      - name: Import persistent signing identity
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$MACOS_SIGN_P12"
          test -n "$MACOS_SIGN_PASSWORD"
          keychain="$RUNNER_TEMP/release.keychain-db"
          printf '%s' "$MACOS_SIGN_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$MACOS_SIGN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$MACOS_SIGN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$MACOS_SIGN_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_SIGN_PASSWORD" "$keychain" >/dev/null
          security find-certificate -c 'This Is Logged Release Signing' -p "$keychain" > "$RUNNER_TEMP/signing.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k "$keychain" "$RUNNER_TEMP/signing.pem"
          echo "MACOS_SIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo 'MACOS_SIGN_IDENTITY=This Is Logged Release Signing' >> "$GITHUB_ENV"

      - name: Build application
        run: scripts/package-macos.sh

      - name: Generate signed appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY"
          version=${GITHUB_REF_NAME#v}
          mkdir -p dist/update
          cp "dist/This-Is-Logged-$version.zip" dist/update/
          if [[ -f "release-notes/$version.md" ]]; then
            cp "release-notes/$version.md" "dist/update/This-Is-Logged-$version.md"
          else
            previous=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
            git log --pretty='- %s' "${previous:+$previous..}$GITHUB_REF_NAME" > "dist/update/This-Is-Logged-$version.md"
          fi
          printf '%s' "$SPARKLE_PRIVATE_KEY" | ".build/artifacts/sparkle/Sparkle/bin/generate_appcast" \
            --ed-key-file - \
            --embed-release-notes \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/" \
            -o dist/update/appcast.xml \
            dist/update

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          if [[ -f "release-notes/$version.md" ]]; then
            notes=(--notes-file "release-notes/$version.md")
          else
            notes=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" \
            "dist/This-Is-Logged-$version.zip" \
            "dist/This Is Logged.dmg" \
            "dist/update/appcast.xml" \
            "${notes[@]}" \
            --title "This Is Logged $version"

      - name: Remove signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/signing.pem"
